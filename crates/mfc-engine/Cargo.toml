[package]
name = "mfc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motore audio di Mixfonocraft: sequencer, mixer, automazioni, render offline"

[features]
default = []
# Uscita audio realtime tramite cpal (richiede ALSA su Linux).
realtime = ["dep:cpal"]

[dependencies]
mfc-core.workspace = true
mfc-plugins.workspace = true
mfc-dsp.workspace = true
crossbeam-channel.workspace = true
hound.workspace = true
thiserror.workspace = true
cpal = { workspace = true, optional = true }
