[package]
name = "mfc-test-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Plugin clap di prova per i test d'integrazione di mfc-host"

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "params", "state", "audio-ports", "note-ports"] }
